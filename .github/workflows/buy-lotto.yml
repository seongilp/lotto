name: Weekly Lotto Purchase

on:
  schedule:
    # 매주 토요일 09:13 KST — 정각(00:00 UTC) 슬롯은 GitHub 혼잡으로 지연/스킵이 잦아 회피
    - cron: "13 0 * * 6"
  workflow_dispatch:

jobs:
  buy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        env:
          # PyPI 배포판 대신 포크 소스를 설치해 수정사항(비밀번호 변경 유예 등)을 반영
          SETUPTOOLS_SCM_PRETEND_VERSION: '0.0.0'
        run: pip install "dhapi @ git+https://github.com/seongilp/dhlottery-api@main"

      - name: Write credentials
        run: |
          mkdir -p ~/.dhapi
          cat > ~/.dhapi/credentials <<'EOF'
          [default]
          username = "${{ secrets.DHLOTTERY_USERNAME }}"
          password = "${{ secrets.DHLOTTERY_PASSWORD }}"
          EOF
          chmod 600 ~/.dhapi/credentials

      - name: Buy lotto (5 games / 5,000 KRW)
        run: python scripts/buy_weekly.py

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: purchase-log
          path: logs/
          retention-days: 30
